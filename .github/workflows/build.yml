name: Build SwarnaBill APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup App Directory & Config
        run: |
          mkdir -p www
          cp -r index.html manifest.json icon-192.png icon-512.png www/ 2>/dev/null || true
          [ -f sw.js ] && cp sw.js www/ || true

          cat << 'EOF' > package.json
          {
            "name": "swarnabill-app",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.swarnabill.pos",
            "appName": "SwarnaBill",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Setup Capacitor Android & Inject Native PrintManager
        run: |
          npm install
          npx cap add android
          npx cap copy android

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          cat << 'EOF' > "$MAIN_ACT"
          package com.swarnabill.pos;

          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private WebView printWebView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new NativePrintBridge(), "AndroidPrint");
                  }
              }

              public class NativePrintBridge {
                  @JavascriptInterface
                  public void printHtml(final String htmlContent, final String jobName) {
                      runOnUiThread(() -> {
                          printWebView = new WebView(MainActivity.this);
                          printWebView.getSettings().setJavaScriptEnabled(false);
                          printWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                  String docName = (jobName != null && !jobName.isEmpty()) ? jobName : "SwarnaBill_Invoice";
                                  PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(docName);
                                  PrintAttributes.Builder builder = new PrintAttributes.Builder();
                                  builder.setMediaSize(PrintAttributes.MediaSize.ISO_A4);
                                  if (printManager != null) {
                                      printManager.print(docName, adapter, builder.build());
                                  }
                              }
                          });
                          printWebView.loadDataWithBaseURL("https://localhost/", htmlContent, "text/html", "UTF-8", null);
                      });
                  }
              }
          }
          EOF

      - name: Compile APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SwarnaBill.apk

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SwarnaBill App v1.0.${{ github.run_number }}"
          body: "Direct installable APK with Native Android PrintManager & Auto-Saved Bill Records"
          files: SwarnaBill.apk
